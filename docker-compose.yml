version: "3.9"

services:
  # ── FastAPI ────────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: educrm_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://crm_user:strongpassword123@db:5432/educrm_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: educrm_db
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: strongpassword123
      POSTGRES_DB: educrm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d educrm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: educrm_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Celery Worker ──────────────────────────────────────────────────────────
  celery:
    build: .
    container_name: educrm_celery
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://crm_user:strongpassword123@db:5432/educrm_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # ── Celery Beat (Scheduler) ────────────────────────────────────────────────
  celery-beat:
    build: .
    container_name: educrm_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  # ── Telegram Bot ───────────────────────────────────────────────────────────
  bot:
    build: .
    container_name: educrm_bot
    command: python run_bot.py
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # ── Frontend (React/Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ../CRM-oquv_markazlar_frontend
    container_name: educrm_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
